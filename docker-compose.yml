services:
  postgres:
    image: postgres:16
    container_name: yen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pw}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: yen-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  clamav:
    image: clamav/clamav:1.4
    container_name: yen-clamav
    restart: unless-stopped
    # Loopback-only mapping: the scanner stays private to the local machine
    # while the API running outside compose can reach it at 127.0.0.1:3310.
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Fresh clamav/clamav containers download signature databases first.
      start_period: 5m

  # Local EVM node for demo anchoring. Opt-in via the "chain" profile; `pnpm dev:full` starts it.
  # Blocks are mined every second so the worker's 12-block confirmation depth passes in seconds.
  chain:
    image: ghcr.io/foundry-rs/foundry:v1.5.0
    container_name: yen-anvil
    profiles: ["chain"]
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "127.0.0.1:${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
  redis_data:
  clamav_data:
