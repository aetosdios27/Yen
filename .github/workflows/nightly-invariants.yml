name: Nightly ledger invariants

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      ops:
        description: Invariant operation count
        type: choice
        options: ["100000", "1000000"]
        default: "100000"
        required: true

permissions:
  contents: read

concurrency:
  group: nightly-invariants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invariants:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ops == '1000000' && 360 || 90 }}
    env:
      YEN_TEST_DATABASE_URL: postgres://postgres:nightly@localhost:5432/postgres
      YEN_RESTORE_ADMIN_URL: postgres://postgres:nightly@localhost:5432/postgres
      NIGHTLY_SEED: ${{ github.run_id }}
      NIGHTLY_OPS: ${{ github.event.inputs.ops || '100000' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nightly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install PostgreSQL client tools
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          pg_dump --version
      - run: pnpm install --frozen-lockfile
      - name: Run seeded ledger invariants
        run: pnpm --filter @yen/ledger invariants:load -- --ops "$NIGHTLY_OPS" --seed "$NIGHTLY_SEED" --batch 100
      - name: Run backup and restore drill
        run: pnpm --filter @yen/ledger backup:restore

  alert:
    if: always() && needs.invariants.result == 'failure'
    needs: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update nightly failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$(printf 'Nightly ledger invariants or restore drill failed.\n\nRun: %s\nSeed: %s' "$RUN_URL" "$SEED")"
          issue="$(gh issue list --state open --search '"Nightly invariants failed" in:title' --json number,title --jq '.[] | select(.title == "Nightly invariants failed") | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title "Nightly invariants failed" --body "$body"
          fi
