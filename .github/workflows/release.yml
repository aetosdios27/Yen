name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      YEN_RELEASE_TAG: ${{ github.ref_name }}
      YEN_PROVENANCE_URL: https://github.com/${{ github.repository }}/attestations
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Initialize release artifact directory
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/yen-release" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Validate release tag and toolchain
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.split("@").at(-1)')"

      - run: pnpm install --frozen-lockfile

      - name: Build twice and compare release artifact
        run: bash scripts/repro-build.sh "$ARTIFACT_DIR"

      - name: Generate CycloneDX SBOM with checksum-verified Syft
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/anchore/syft/releases/download/v1.42.1/syft_1.42.1_linux_amd64.tar.gz \
            --output "$archive"
          # GitHub release asset digest: anchore/syft v1.42.1 linux_amd64.
          printf '989ded4e772810f93de6ccdc4512f79a6dabb5fb2dd2a9ffc72a80c955e6125a  %s\n' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/syft-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/syft-bin" syft
          "$RUNNER_TEMP/syft-bin/syft" scan dir:. -o "cyclonedx-json=$RUNNER_TEMP/sbom.cdx.json"

      - name: Add SBOM and check release assets
        env:
          SBOM_FILE: ${{ runner.temp }}/sbom.cdx.json
        run: |
          bash scripts/prepare-release-assets.sh "$ARTIFACT_DIR" "$YEN_RELEASE_TAG" "$SBOM_FILE"

      - name: Upload unsigned release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yen-release-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release/*
          if-no-files-found: error
          retention-days: 1

  independent-build:
    name: Independently rebuild on another runner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      YEN_RELEASE_TAG: ${{ github.ref_name }}
      YEN_PROVENANCE_URL: https://github.com/${{ github.repository }}/attestations
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Initialize release artifact directory
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/yen-release" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Validate release tag and toolchain
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.split("@").at(-1)')"

      - run: pnpm install --frozen-lockfile

      - name: Build twice and compare release artifact
        run: bash scripts/repro-build.sh "$ARTIFACT_DIR"

      - name: Upload independently rebuilt checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yen-independent-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Attest and sign release files
    needs: [build, independent-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      YEN_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Initialize release artifact directory
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/yen-release" >> "$GITHUB_ENV"

      - name: Download unsigned release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yen-release-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release

      - name: Download independently rebuilt checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yen-independent-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-independent

      - name: Require independent archive digest to match before signing
        run: |
          head -n 1 "$ARTIFACT_DIR/SHA256SUMS" > "$RUNNER_TEMP/archive-SHA256SUMS"
          cmp "$RUNNER_TEMP/archive-SHA256SUMS" "$RUNNER_TEMP/yen-independent/SHA256SUMS"
          cd "$ARTIFACT_DIR"
          sha256sum --check SHA256SUMS

      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/yen-release/*

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Create keyless signatures
        run: |
          for file in "$ARTIFACT_DIR/yen-${YEN_RELEASE_TAG}.tar" "$ARTIFACT_DIR/sbom.cdx.json" "$ARTIFACT_DIR/SHA256SUMS"; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Upload signed release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yen-release-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      YEN_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Initialize release artifact directory
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/yen-release" >> "$GITHUB_ENV"

      - name: Download signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yen-release-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_draft="$(gh release view "$YEN_RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$release_draft" == "false" ]]; then
            echo "Release is already published; leaving its immutable assets unchanged."
            exit 0
          fi
          if [[ -z "$release_draft" ]]; then
            gh release create "$YEN_RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$YEN_RELEASE_TAG" "$ARTIFACT_DIR"/* --clobber
          gh release edit "$YEN_RELEASE_TAG" --draft=false
