name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT_DIR: ${{ runner.temp }}/yen-release
      YEN_RELEASE_TAG: ${{ github.ref_name }}
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Validate release tag and toolchain
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.split("@").at(-1)')"

      - run: pnpm install --frozen-lockfile

      - name: Build twice and compare release artifact
        run: bash scripts/repro-build.sh "$ARTIFACT_DIR"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          syft-version: v1.42.1
          upload-artifact: false
          upload-release-assets: false

      - name: Add SBOM and checksums
        env:
          SBOM_FILE: ${{ runner.temp }}/sbom.cdx.json
        run: |
          cp "$SBOM_FILE" "$ARTIFACT_DIR/sbom.cdx.json"
          cd "$ARTIFACT_DIR"
          sha256sum "yen-${YEN_RELEASE_TAG}.tar" sbom.cdx.json > SHA256SUMS

      - name: Upload unsigned release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yen-release-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release/*
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Attest and sign release files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ARTIFACT_DIR: ${{ runner.temp }}/yen-release
      YEN_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download unsigned release files
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: yen-release-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release

      - name: Attest release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/yen-release/*

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v3.1.4

      - name: Create keyless signatures
        run: |
          for file in "$ARTIFACT_DIR/yen-${YEN_RELEASE_TAG}.tar" "$ARTIFACT_DIR/sbom.cdx.json" "$ARTIFACT_DIR/SHA256SUMS"; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Upload signed release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yen-release-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ARTIFACT_DIR: ${{ runner.temp }}/yen-release
      YEN_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download signed release files
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: yen-release-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yen-release

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_draft="$(gh release view "$YEN_RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$release_draft" == "false" ]]; then
            echo "Release is already published; leaving its immutable assets unchanged."
            exit 0
          fi
          if [[ -z "$release_draft" ]]; then
            gh release create "$YEN_RELEASE_TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$YEN_RELEASE_TAG" "$ARTIFACT_DIR"/* --clobber
          gh release edit "$YEN_RELEASE_TAG" --draft=false
