name: Load Tests

on:
  pull_request:
    paths:
      - "packages/load-tests/**"
      - "apps/api/**"
      - "packages/db/**"
      - ".github/workflows/load-test.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-test:
    name: Performance Budgets & Load Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEN_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-load-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-load-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm turbo run build

      - name: Run unit & integration tests
        run: pnpm --filter @yen/load-tests test

      - name: Run load-test harness and assert performance budgets
        run: pnpm test:load --duration 5 --connections 10 --verify-state
