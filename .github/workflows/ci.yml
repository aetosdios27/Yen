name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEN_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Verify published audit vectors in Node and Python
        run: pnpm --filter @yen/verifier vectors:check
      - name: Rehearse release archive checks (no publish or signing)
        if: github.event_name == 'pull_request'
        run: |
          rehearsal_dir="$(mktemp -d)"
          trap 'rm -rf "$rehearsal_dir"' EXIT
          release_tag="local-${GITHUB_SHA:0:12}"
          YEN_RELEASE_TAG="$release_tag" bash scripts/repro-build.sh "$rehearsal_dir"
          printf '{"bomFormat":"CycloneDX","specVersion":"1.6","components":[]}\n' > "$rehearsal_dir/rehearsal-sbom.json"
          bash scripts/prepare-release-assets.sh "$rehearsal_dir" "$release_tag" "$rehearsal_dir/rehearsal-sbom.json"

      - name: Lint and format
        run: pnpm check

      - name: OpenAPI diff
        run: |
          pnpm turbo run build --filter="@yen/api^..."
          pnpm --filter @yen/api openapi:check
          pnpm --filter @yen/api-client generate:check

      - name: Governance guard
        run: node --test .github/scripts/governance.test.mjs .github/scripts/references.test.mjs .github/scripts/trust-claims.test.mjs

      - name: Foreign key index check
        run: pnpm --filter @yen/db check:fk-indexes

      - name: Typecheck, test, build
        env:
          BASE_REF: ${{ github.base_ref }}
          TURBO_CACHE_DIR: .turbo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run typecheck test build --filter="...[origin/${BASE_REF}]"
          else
            pnpm turbo run typecheck test build
          fi

      - name: Accessibility (axe, zero violations)
        run: pnpm --filter @yen/web test:a11y

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  pr-checks:
    name: PR checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Semantic PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

      - name: Linked Linear issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: no issue required."
            exit 0
          fi
          if printf '%s\n%s\n%s' "$TITLE" "$BODY" "$BRANCH" | grep -Eiq '(^|[^a-z0-9])yen-[0-9]+([^0-9]|$)'; then
            echo "Linear issue reference found."
          else
            echo "::error::Reference a Linear issue (e.g. YEN-12) in the PR title, description or branch name."
            exit 1
          fi

  foundry:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: yen_test
          POSTGRES_DB: yen_anvil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yen_anvil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YEN_ANVIL_TEST_DATABASE_URL: postgres://postgres:yen_test@127.0.0.1:5432/yen_anvil
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Foundry v1.5.0 with verified checksum
        run: |
          set -euo pipefail
          # Published SHA-256: https://api.github.com/repos/foundry-rs/foundry/releases/tags/v1.5.0
          # assets[name=foundry_v1.5.0_linux_amd64.tar.gz].digest
          archive="$RUNNER_TEMP/foundry_v1.5.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/foundry-rs/foundry/releases/download/v1.5.0/foundry_v1.5.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '5cd98f9092bcc28be087939491f786b2bf3ed55e492996a409e29519b8ab4dc8  %s\n' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/foundry-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/foundry-bin" forge anvil
          echo "$RUNNER_TEMP/foundry-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry-bin/forge" --version

      - run: forge fmt --check
      - run: forge build
      - name: Build queue and workspace dependencies
        run: pnpm --filter @yen/queue... build
        working-directory: .
      - name: Run the real Anvil anchoring integration test
        run: pnpm --filter @yen/queue test -- src/anchoring.test.ts -t "deploys RootRegistry and publishes a root on a real local Anvil chain"
        working-directory: .
      - name: Test deployment manifest writer
        run: node --test contracts/script/*.test.mjs
        working-directory: .
      - run: forge test
      - name: Require full RootRegistry line and branch coverage
        run: |
          forge coverage --report summary --report lcov
          node script/check-coverage.mjs
      - run: forge snapshot --check
      - name: Check generated shared ABI
        run: node script/export-abi.mjs --check

  gate:
    name: CI Gate
    if: always()
    needs: [verify, secrets, dependency-review, pr-checks, foundry]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # verify, secrets, and foundry always run; the others are skipped outside pull requests.
          echo "$NEEDS" | jq -e '
            (.verify.result == "success") and
            (.secrets.result == "success") and
            (.foundry.result == "success") and
            (.["dependency-review"].result | IN("success", "skipped")) and
            (.["pr-checks"].result | IN("success", "skipped"))
          ' > /dev/null
