name: Infra Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read

concurrency:
  group: infra-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: infra

jobs:
  # Static checks run on every infra PR with no AWS access at all:
  # formatting and structural validation of the Terraform configuration.
  static-checks:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Post static checks summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- yen-infra-plan -->';
            const body = [
              marker,
              '## Infra plan summary',
              '',
              'Terraform fmt and validate passed for `infra/` (region ap-south-1, staging).',
              '',
              'No apply is possible from a PR. Applies are manual by an operator.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Real terraform plan against the AWS account. Runs only when the plan
  # role is configured as the AWS_PLAN_ROLE_ARN repository variable, and
  # authenticates through GitHub OIDC. There are no static cloud
  # credentials anywhere in the repo. There is no apply job: CI is
  # structurally incapable of mutating infrastructure.
  plan:
    name: Terraform plan
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.AWS_PLAN_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: yen-infra-plan-${{ github.event.pull_request.number || github.run_id }}

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Terraform plan
        working-directory: infra
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false \
            -out=tfplan.tfplan 2>&1 | tee tfplan.txt

      - name: Post plan summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- yen-infra-plan -->';
            let plan = '';
            try {
              plan = fs.readFileSync('infra/tfplan.txt', 'utf8');
            } catch (err) {
              plan = 'Plan output unavailable.';
            }
            // Keep the comment readable: strip ANSI remnants and cap size.
            plan = plan.replace(/\u001b\[[0-9;]*m/g, '').trim();
            const cap = 50000;
            const truncated = plan.length > cap
              ? plan.slice(plan.length - cap)
              : plan;
            const truncationNote = plan.length > cap
              ? '\n\n(Plan output truncated; showing the tail of the run.)'
              : '';
            const body = [
              marker,
              '## Infra plan summary',
              '',
              'Terraform plan for `infra/` (region ap-south-1, staging):',
              '',
              '```text',
              truncated,
              '```',
              truncationNote,
              '',
              'No apply is possible from a PR. Applies are manual by an operator.',
            ].filter(Boolean).join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
