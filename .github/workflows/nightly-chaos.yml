name: Nightly Chaos
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: yen
          POSTGRES_DB: yen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YEN_TEST_DATABASE_URL: postgres://postgres:yen@127.0.0.1:5432/yen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@yen/api... --filter=@yen/ledger... --filter=@yen/notifications... --filter=@yen/queue...
      - run: pnpm --filter @yen/ledger test:chaos:randomized
        id: chaos
        continue-on-error: true
      - name: Open or update the chaos issue
        if: steps.chaos.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Nightly chaos scenarios failed'
          issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="Nightly real Postgres chaos run failed in $GITHUB_RUN_URL. Inspect the logs for the reproducible seed."
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Fail workflow after reporting
        if: steps.chaos.outcome == 'failure'
        run: exit 1
